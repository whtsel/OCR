plugins {
    id 'com.android.application'
}

// The helper-enabled v90 build includes an official, byte-pinned zipapp and the tested Android runtime.
// The dependency-free baseline/standalone build remains available.
def musicHelper = providers.gradleProperty('bbxMusicHelper').getOrElse('true') == 'true'
def helperAbi = providers.gradleProperty('bbxHelperAbi').getOrElse('arm64-v8a')
def offlineMusic = providers.gradleProperty('bbxOfflineMusic').getOrElse('false') == 'true'
if (offlineMusic && !musicHelper) throw new GradleException('The offline v90 build requires the pinned music helper.')
def fastPreview = !offlineMusic && providers.gradleProperty('bbxFastStartPreview').getOrElse('false') == 'true'
def preview = offlineMusic || fastPreview || providers.gradleProperty('bbxHelperPreview').getOrElse('false') == 'true'
def helperRaw = layout.buildDirectory.dir('generated/musicHelper/res')
def previewRes = layout.buildDirectory.dir('generated/musicHelperPreview/res')

android {
    namespace 'com.blackboxstream.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blackboxstream.mobile'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '1.4.4-transport'
        testInstrumentationRunner 'com.blackboxstream.mobile.BlackBoxSmoke'
        if (musicHelper) {
            versionCode(offlineMusic ? 19 : 13)
            if (offlineMusic) applicationId 'com.blackboxstream.mobile.offline.transfer'
            versionName(offlineMusic ? '1.5.5-offline' : fastPreview ? '1.4.8-fast' : preview ? '1.4.8-music' : '1.4.8')
            if (!(helperAbi in ['arm64-v8a', 'x86_64'])) throw new GradleException('Unsupported helper ABI: ' + helperAbi)
            ndk { abiFilters += [helperAbi] }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    if (musicHelper) {
        sourceSets.main.java.srcDir('src/musicHelper/java')
        sourceSets.main.res.srcDir('src/musicHelper/res')
        sourceSets.main.res.srcDir(helperRaw)
        packaging {
            jniLibs.useLegacyPackaging = true // libpython/libffmpeg are app executables and need their install paths.
            resources.merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
        if (offlineMusic) {
            sourceSets.main.assets.srcDir('src/offlineMusic/assets')
            sourceSets.debug.res.srcDir(previewRes)
            sourceSets.release.res.srcDir(previewRes)
        } else if (preview) {
            buildTypes.debug.applicationIdSuffix = fastPreview ? '.music.fast' : '.music'
            sourceSets.debug.res.srcDir(previewRes)
        }
    }

    androidResources {
        // MediaPlayer needs seekable, uncompressed Android resource descriptors.
        noCompress += ['mp4', 'm4a']
    }
}

if (musicHelper) {
    def zipapp = rootProject.file('vendor/ytdlp')
    tasks.register('stagePinnedMusicHelper') {
        inputs.file(zipapp)
        inputs.property('musicPreview', preview)
        inputs.property('fastStartPreview', fastPreview)
        inputs.property('offlineMusic', offlineMusic)
        outputs.dir(helperRaw)
        if (preview) outputs.dir(previewRes)
        doLast {
            def bytes = zipapp.bytes
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
            if (bytes.length != 3073072 || hash != 'e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3') {
                throw new GradleException('yt-dlp does not match the phone-tested 2026.10.26 pin.')
            }
            def raw = helperRaw.get().file('raw/ytdlp').asFile
            raw.parentFile.mkdirs()
            raw.bytes = bytes
            if (preview) {
                def label = previewRes.get().file('values/strings.xml').asFile
                label.parentFile.mkdirs()
                def appName = offlineMusic ? 'BlackBox Stream v90 Offline 1.5.5' : fastPreview ? 'BlackBox Music Fast Start' : 'BlackBox Music v90'
                label.text = "<resources><string name=\"app_name\">${appName}</string></resources>"
            }
        }
    }
    tasks.named('preBuild') { dependsOn('stagePinnedMusicHelper') }
    dependencies {
        implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
        implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
        implementation 'io.github.junkfood02.youtubedl-android:common:0.18.1'
        implementation 'org.apache.commons:commons-compress:1.12'
    }
}
