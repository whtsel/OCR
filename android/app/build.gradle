plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackboxstream.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blackboxstream.mobile'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'com.blackboxstream.mobile.BlackBoxSmoke'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        // MediaPlayer needs seekable, uncompressed Android resource descriptors.
        noCompress += ['mp4', 'm4a']
    }
}
