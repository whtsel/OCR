name: BlackBox Android smoke
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['android/**', '.github/workflows/blackbox-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/blackbox-android.yml']
permissions:
  contents: read
concurrency:
  group: blackbox-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify the original desktop source assets
        working-directory: android/app/src/main/assets/v90
        run: sha256sum -c ../../../../../V90-ASSETS.sha256
      - name: Run HTTPS transport regressions
        run: python3 android/tests/run_host.py
      - name: Build app and instrumentation APKs
        working-directory: android
        run: |
          log=$(mktemp)
          if ! gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain > "$log" 2>&1; then
            tail -80 "$log"
            detail=$(grep -A4 -F 'What went wrong:' "$log" | tail -4 | head -c 900)
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error::Android Gradle build failed. %s\n' "${detail:-$(tail -1 "$log")}"
            exit 1
          fi
          tail -12 "$log"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare independent torrent fixture
        run: |
          log=$(mktemp)
          if ! python3 -m pip install --only-binary=:all: 'libtorrent==2.1.1' > "$log" 2>&1; then
            cat "$log"
            detail=$(grep '^ERROR:' "$log" | tail -3 | head -c 900)
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error::libtorrent fixture install failed on %s. %s\n' "$(python3 --version)" "$detail"
            exit 1
          fi
          python3 -c 'import libtorrent; print(libtorrent.version)'
      - name: Check the first and last pieces of the public open films
        continue-on-error: true
        run: python3 android/tests/check_open_films.py
      - name: Enable Android emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real anime, music, movie and offline playback before packaging
        env:
          BBX_VERIFY_LIVE_FILM: '1'
          BBX_VERIFY_PUBLIC_MEDIA: '1'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          script: |
            adb shell wm size 720x1560
            adb shell wm density 320
            BBX_VERIFY_MUSIC_ONLY=1 BBX_VERIFY_LIVE_FILM=0 bash android/tests/run_device.sh
            python3 android/tests/run_device_fixtures.py --record-public-hashes "${{ runner.temp }}/media-hashes.txt"
            adb uninstall com.blackboxstream.mobile.test
            adb uninstall com.blackboxstream.mobile
            bash android/tools/build_apk.sh "${{ runner.temp }}/BlackBox-Stream-Android.apk"
            bash android/tests/check_standalone.sh "${{ runner.temp }}/BlackBox-Stream-Android.apk" "${{ runner.temp }}/media-hashes.txt"
      - name: Retain the tested standalone package for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackbox-verified-standalone
          path: ${{ runner.temp }}/BlackBox-Stream-Android.apk
          if-no-files-found: error
          retention-days: 3
