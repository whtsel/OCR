name: BlackBox Android smoke
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['android/**', '.github/workflows/blackbox-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/blackbox-android.yml']
permissions:
  contents: read
concurrency:
  group: blackbox-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - name: Run HTTPS transport regressions
        run: python3 android/tests/run_host.py
      - name: Build app and instrumentation APKs
        working-directory: android
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Enable Android emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android 15 instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          script: ./android/tests/run_device.sh
