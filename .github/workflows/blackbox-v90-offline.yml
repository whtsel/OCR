name: BlackBox Stream v90 Offline Android
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'android/app/**'
      - 'android/vendor/**'
      - 'android/tests/test_catalogue_music.py'
      - '.github/ci/smoke_v90_offline.py'
      - '.github/ci/verify_blackbox_v90_helper.py'
      - '.github/workflows/blackbox-v90-offline.yml'
permissions:
  contents: read
concurrency:
  group: blackbox-v90-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify v90 sources and the exact-recording matcher
        run: |
          (cd android/vendor && sha256sum -c ytdlp.sha256)
          (cd android/app/src/main/assets/v90 && sha256sum -c ../../../../../V90-ASSETS.sha256)
          node --check android/app/src/offlineMusic/assets/v90-offline/offline-music.js
          python3 -B android/tests/test_catalogue_music.py
      - name: Build the full v90 app and sign the side-by-side package
        run: |
          log=$(mktemp)
          if ! (cd android && gradle :app:assembleRelease --no-daemon --console=plain -PbbxOfflineMusic=true) > "$log" 2>&1; then
            tail -80 "$log"
            detail=$(grep -A5 -E 'error:|What went wrong:' "$log" | head -c 2000 || true)
            printf '::error::%s\n' "${detail//$'\n'/' / '}"
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="$RUNNER_TEMP/BlackBox-Stream-v90-Offline-ARM64.apk"
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/offline-preview.p12" -storepass test-only -keypass test-only \
            -alias preview -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=BlackBox Stream v90 Offline Test' >/dev/null
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/offline-preview.p12" --ks-pass pass:test-only --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -P 16 -c 4 "$apk"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -q "^package: name='com.blackboxstream.mobile.offline' versionCode='14' versionName='1.5.0-offline'" "$RUNNER_TEMP/badging.txt"
          grep -q "^application-label:'BlackBox Stream v90 Offline'$" "$RUNNER_TEMP/badging.txt"
          grep -q "^launchable-activity: name='com.blackboxstream.mobile.V90Activity'" "$RUNNER_TEMP/badging.txt"
          grep -q "^native-code: 'arm64-v8a'$" "$RUNNER_TEMP/badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"; then echo 'Debuggable phone package' >&2; exit 1; fi
          python3 -B .github/ci/verify_blackbox_v90_helper.py "$apk" --offline
          echo "::notice::$(sha256sum "$apk")"
      - name: Build the x86 sibling and stage deterministic fixtures
        run: |
          log=$(mktemp)
          if ! (cd android && gradle :app:assembleDebug --no-daemon --console=plain -PbbxOfflineMusic=true -PbbxHelperAbi=x86_64) > "$log" 2>&1; then
            tail -80 "$log"
            detail=$(grep -A5 -E 'error:|What went wrong:' "$log" | head -c 2000 || true)
            printf '::error::%s\n' "${detail//$'\n'/' / '}"
            exit 1
          fi
          bash .github/ci/install_audio_probe.sh
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/offline-tools" websocket-client==1.8.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the v90 shell, Find, album queue and offline restart (synthetic audio)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          script: PYTHONPATH=".github/ci:$RUNNER_TEMP/offline-tools" python3 -B -u .github/ci/smoke_v90_offline.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlackBox-Stream-v90-Offline-ARM64
          path: ${{ runner.temp }}/BlackBox-Stream-v90-Offline-ARM64.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
