name: BlackBox Stream v90 Offline Android
on:
  workflow_dispatch:
    inputs:
      publish_apk:
        description: Publish a tested, separately installable ARM64 APK
        type: boolean
        default: false
      publish_download_test:
        description: Publish the separate ARM64 Download Test APK with local copyable reports
        type: boolean
        default: false
      verify_live_catalogue:
        description: Compare a fresh Espresso save in full v90 Find and the archived-helper pilot (no upload)
        type: boolean
        default: false
      pilot_only:
        description: In a live trial, run only the original-helper control (do not retry full v90)
        type: boolean
        default: false
  push:
    branches: ['arena/**']
    paths:
      - 'android/app/**'
      - 'android/vendor/**'
      - 'android/tests/test_catalogue_music.py'
      - 'android/tests/test_offline_find.cjs'
      - 'android/tests/test_pc_offline_selection.cjs'
      - '.github/ci/smoke_v90_offline.py'
      - '.github/ci/verify_blackbox_v90_helper.py'
      - '.github/workflows/blackbox-v90-offline.yml'
permissions:
  contents: read
concurrency:
  group: blackbox-v90-offline-${{ github.ref }}-${{ inputs.verify_live_catalogue && 'live' || inputs.publish_download_test && 'download-test' || inputs.publish_apk && 'publish' || 'fixtures' }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
      APK_PACKAGE: ${{ inputs.publish_download_test && 'com.blackboxstream.mobile.offline.diagnostic' || inputs.publish_apk && 'com.blackboxstream.mobile.offline.search' || 'com.blackboxstream.mobile.offline.desktop' }}
      ARTIFACT_NAME: ${{ inputs.publish_download_test && 'BlackBox-Stream-v90-Download-Test-ARM64' || inputs.publish_apk && 'BlackBox-Stream-v90-Offline-1.5.9-ARM64' || 'BlackBox-Stream-v90-Offline-test-only' }}
      APK_VERSION: ${{ inputs.publish_download_test && '1.5.9-download-test' || '1.5.9-offline' }}
      APK_LABEL: ${{ inputs.publish_download_test && 'BlackBox Stream v90 Download Test' || 'BlackBox Stream v90 Offline 1.5.9' }}
    steps:
      - name: Verify the selected build mode
        if: ${{ inputs.publish_download_test && (inputs.publish_apk || inputs.verify_live_catalogue) }}
        run: |
          echo '::error::Choose just publish_download_test for the diagnostic build.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Build the exact 1.5.4 source for the same-package upgrade test.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify v90 sources and PC selection parity
        run: |
          (cd android/vendor && sha256sum -c ytdlp.sha256)
          (cd android/app/src/main/assets/v90 && sha256sum -c ../../../../../V90-ASSETS.sha256)
          node --check android/app/src/offlineMusic/assets/v90-offline/offline-music.js
          node --test android/tests/test_offline_find.cjs android/tests/test_pc_offline_selection.cjs
          python3 -B android/tests/test_catalogue_music.py
      - name: Build the v90 ARM64 candidate
        if: ${{ !inputs.verify_live_catalogue }}
        run: |
          log=$(mktemp)
          if ! (cd android && gradle :app:assembleRelease --no-daemon --console=plain -PbbxOfflineMusic=true \
              -PbbxOfflineSideBySide=${{ inputs.publish_apk && 'true' || 'false' }} \
              -PbbxOfflineDownloadTest=${{ inputs.publish_download_test && 'true' || 'false' }}) > "$log" 2>&1; then
            tail -80 "$log"
            detail=$(grep -A5 -E 'error:|What went wrong:' "$log" | head -c 2000 || true)
            printf '::error::%s\n' "${detail//$'\n'/' / '}"
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/v90-unsigned.apk"
      - name: Verify the ARM64 candidate with a temporary test key
        if: ${{ !inputs.verify_live_catalogue }}
        id: package
        continue-on-error: true # Still capture emulator results; the final gate requires both.
        run: |
          set -Eeuo pipefail
          phase=alignment
          trap 'code=$?; echo "::error::ARM64 verification failed during $phase (exit $code)"; exit "$code"' ERR
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="$RUNNER_TEMP/$ARTIFACT_NAME.apk"
          "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/v90-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          phase=key-generation
          keytool -genkeypair -keystore "$RUNNER_TEMP/offline-preview.p12" -storepass test-only -keypass test-only \
            -alias preview -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=BlackBox Stream v90 Offline Test' >/dev/null
          phase=signing
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/offline-preview.p12" --ks-pass pass:test-only --out "$apk" "$RUNNER_TEMP/aligned.apk"
          phase=signature-check
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -P 16 -c 4 "$apk"
          phase=manifest-check
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          metadata=$(grep -E '^(package:|application-label:|launchable-activity:|native-code:|application-debuggable)' "$RUNNER_TEMP/badging.txt")
          echo "::notice::${metadata//$'\n'/' / '}"
          grep -Fq "package: name='$APK_PACKAGE' versionCode='23' versionName='$APK_VERSION'" "$RUNNER_TEMP/badging.txt"
          grep -Fxq "application-label:'$APK_LABEL'" "$RUNNER_TEMP/badging.txt"
          grep -q "^launchable-activity: name='com.blackboxstream.mobile.V90Activity'" "$RUNNER_TEMP/badging.txt"
          grep -q "^native-code: 'arm64-v8a'$" "$RUNNER_TEMP/badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"; then echo '::error::Debuggable phone package'; exit 1; fi
          phase=package-content
          if ! report=$(python3 -B .github/ci/verify_blackbox_v90_helper.py "$apk" --offline 2>&1); then
            echo "::error::${report//$'\n'/' / '}"
            exit 1
          fi
          echo "$report"
          echo "::notice::$(sha256sum "$apk")"
      - name: Build the x86 v90 sibling and install audio verification tools
        run: |
          log=$(mktemp)
          if ! (cd android && gradle :app:assembleDebug --no-daemon --console=plain -PbbxOfflineMusic=true -PbbxHelperAbi=x86_64) > "$log" 2>&1; then
            tail -80 "$log"
            detail=$(grep -A5 -E 'error:|What went wrong:' "$log" | head -c 2000 || true)
            printf '::error::%s\n' "${detail//$'\n'/' / '}"
            exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/v90-debug.apk"
          bash .github/ci/install_audio_probe.sh
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/offline-tools" websocket-client==1.8.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the x86 sibling of the phone install
        if: ${{ (inputs.publish_apk || inputs.publish_download_test) && !inputs.verify_live_catalogue }}
        run: |
          log=$(mktemp)
          if ! (cd android && gradle :app:assembleDebug --no-daemon --console=plain -PbbxOfflineMusic=true \
              -PbbxOfflineSideBySide=${{ inputs.publish_apk && 'true' || 'false' }} -PbbxHelperAbi=x86_64 \
              -PbbxOfflineDownloadTest=${{ inputs.publish_download_test && 'true' || 'false' }}) > "$log" 2>&1; then
            tail -80 "$log"
            echo '::error::Could not build the x86 sibling of the APK'
            exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/v90-side-by-side-debug.apk"
      - name: Build the 1.5.4 x86 reference with the same CI debug signer
        if: ${{ !inputs.verify_live_catalogue }}
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/v90-offline-reference"
          mkdir -p "$reference"
          git archive f3e1c00be153c152ae88a6cc5b97b8c2392fae0e android | tar -x -C "$reference"
          log=$(mktemp)
          if ! (cd "$reference/android" && gradle :app:assembleDebug --no-daemon --console=plain -PbbxOfflineMusic=true -PbbxHelperAbi=x86_64) > "$log" 2>&1; then
            tail -80 "$log"
            echo '::error::Could not build the 1.5.4 x86 upgrade reference'
            exit 1
          fi
      - name: Assemble a live-only x86 pilot from the archived p11 DEX
        if: ${{ inputs.verify_live_catalogue }}
        run: |
          python3 -B -u .github/ci/check_blackbox_p11.py download "$RUNNER_TEMP/p11.apk"
          bash .github/ci/blackbox-collection/build.sh "$RUNNER_TEMP/p11.apk" android/vendor/ytdlp \
            "$RUNNER_TEMP/pilot-live.apk" x86_64 live
      - name: Verify Android downloads, offline restart and background playback
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          script: >-
            export PYTHONPATH=".github/ci:$RUNNER_TEMP/offline-tools";
            if [ "${{ inputs.verify_live_catalogue }}" = true ]; then
            python3 -B -u .github/ci/compare_v90_offline.py
            "$RUNNER_TEMP/v90-debug.apk" "$RUNNER_TEMP/pilot-live.apk" ${{ inputs.pilot_only && '--only-pilot' || '' }};
            else python3 -B -u .github/ci/smoke_v90_offline.py "$RUNNER_TEMP/v90-debug.apk"
            --upgrade-from "$RUNNER_TEMP/v90-offline-reference/android/app/build/outputs/apk/debug/app-debug.apk"
            ${{ inputs.publish_download_test && '--download-test "$RUNNER_TEMP/v90-side-by-side-debug.apk"' || inputs.publish_apk && '--side-by-side "$RUNNER_TEMP/v90-side-by-side-debug.apk"' || '' }}; fi
      - name: Require ARM64 package verification
        if: ${{ !inputs.verify_live_catalogue && steps.package.outcome != 'success' }}
        run: exit 1
      # Only an explicit request publishes a separate phone install, never the existing-package test build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ (inputs.publish_apk || inputs.publish_download_test) && !inputs.verify_live_catalogue }}
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
