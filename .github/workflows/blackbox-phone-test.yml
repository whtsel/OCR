name: BlackBox helper-only search APK
on:
  workflow_dispatch:
    inputs:
      verify_live_search:
        description: Make a new YouTube query on the emulator and require actual audio playback
        type: boolean
        default: true
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/blackbox-phone-test.yml'
      - '.github/ci/blackbox-phone/**'
      - '.github/ci/check_blackbox_p11.py'
      - 'android/vendor/ytdlp*'
permissions:
  contents: read
concurrency:
  group: blackbox-phone-test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify the Drive-matched helper and search UI contract
        run: |
          (cd android/vendor && sha256sum -c ytdlp.sha256)
          node --test .github/ci/blackbox-phone/helper-phone.test.cjs
          python3 -u .github/ci/check_blackbox_p11.py download "$RUNNER_TEMP/p11.apk"
      - name: Package and verify the test-signed ARM64 APK
        run: |
          apk="$RUNNER_TEMP/BlackBox-Helper-Search-ARM64.apk"
          bash .github/ci/blackbox-phone/build.sh "$RUNNER_TEMP/p11.apk" android/vendor/ytdlp "$apk"
          hash=$(sha256sum "$apk")
          echo "::notice::BlackBox-Helper-Search-ARM64.apk SHA-256 ${hash%% *} ($(stat -c %s "$apk") bytes)"
      - name: Build the x86_64 companion with the same search UI
        run: >-
          bash .github/ci/blackbox-phone/build.sh "$RUNNER_TEMP/p11.apk" android/vendor/ytdlp
          "$RUNNER_TEMP/x86-helper-search.apk" x86_64
      - name: Enable hardware acceleration for the disposable smoke emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the tester and optionally run a live search on the same emulator
        id: android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          script: >-
            PYTHONPATH=.github/ci python3 -B -u .github/ci/blackbox-phone/smoke.py "$RUNNER_TEMP/x86-helper-search.apk"
            ${{ inputs.verify_live_search && '--live' || '' }}
      - name: Retain the startup-verified ARM64 tester even when live access fails
        if: ${{ !cancelled() && steps.android.outputs.startup_ok == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlackBox-Helper-Search-ARM64
          path: ${{ runner.temp }}/BlackBox-Helper-Search-ARM64.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
