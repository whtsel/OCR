name: BlackBox pinned Music helper diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/blackbox-legacy-helper.yml'
      - '.github/ci/check_blackbox_p11.py'
      - '.github/ci/prepare_blackbox_p11_repair.sh'
      - '.github/ci/install_audio_probe.sh'
permissions:
  contents: read
concurrency:
  group: blackbox-legacy-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundled-script:
    name: p19-pinned zipapp on host (no sign-in)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install a host audio decoder
        run: bash .github/ci/install_audio_probe.sh
      - name: Verify p19's release bytes and test exact recordings
        run: |
          python3 -u .github/ci/check_blackbox_p11.py download-refreshed "$RUNNER_TEMP/p19-ytdlp"
          python3 -u .github/ci/check_blackbox_p11.py host --refreshed "$RUNNER_TEMP/p19-ytdlp"
  android-probe:
    name: p19-pinned zipapp in repaired p11 on Android (no sign-in)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the archived app and the refreshed release
        run: |
          python3 -u .github/ci/check_blackbox_p11.py download "$RUNNER_TEMP/blackbox-p11.apk"
          python3 -u .github/ci/check_blackbox_p11.py download-refreshed "$RUNNER_TEMP/p19-ytdlp"
      - name: Install a host audio decoder
        run: bash .github/ci/install_audio_probe.sh
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build a test-only x86_64 probe with the verified zipapp
        run: >-
          bash .github/ci/prepare_blackbox_p11_repair.sh "$RUNNER_TEMP/blackbox-p11.apk"
          "$RUNNER_TEMP/blackbox-probe.apk" native-x86 "$RUNNER_TEMP/p19-ytdlp"
      - name: Enable emulator acceleration and use the runner's DNS resolver
        id: emulator-network
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          dns=$(awk '/^nameserver [0-9]+\./ && $2 !~ /^127\./ {print $2}' /etc/resolv.conf /run/systemd/resolve/resolv.conf 2>/dev/null | head -n 1 || true)
          if [[ "$dns" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "options=-dns-server $dns" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode audio and test original recordings on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio ${{ steps.emulator-network.outputs.options }}
          script: >-
            python3 -u .github/ci/check_blackbox_p11.py android "$RUNNER_TEMP/blackbox-probe.apk"
            --original "$RUNNER_TEMP/blackbox-p11.apk" --native-x86 --refreshed
