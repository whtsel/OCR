name: BlackBox legacy Music helper diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/blackbox-legacy-helper.yml'
      - '.github/ci/check_blackbox_p11.py'
      - '.github/ci/prepare_blackbox_p11_repair.sh'
      - '.github/ci/install_audio_probe.sh'
permissions:
  contents: read
concurrency:
  group: blackbox-legacy-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundled-script:
    name: Original downloader bytes on host
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install a host audio decoder
        run: bash .github/ci/install_audio_probe.sh
      - name: Control audio and exact original recordings
        run: python3 -u .github/ci/check_blackbox_p11.py host
  old-app:
    name: p11 on API ${{ matrix.api }} (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            variant: archived
          - api: 35
            variant: zip-dependency
          - api: 35
            variant: native-x86
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify the archived APK
        run: python3 -u .github/ci/check_blackbox_p11.py download "$RUNNER_TEMP/blackbox-p11.apk"
      - name: Install a host audio decoder
        run: bash .github/ci/install_audio_probe.sh
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: matrix.variant != 'archived'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Make a temporary diagnostic APK
        if: matrix.variant != 'archived'
        run: bash .github/ci/prepare_blackbox_p11_repair.sh "$RUNNER_TEMP/blackbox-p11.apk" "$RUNNER_TEMP/blackbox-probe.apk" "${{ matrix.variant }}"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test helper startup and real Music playback
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          script: >-
            if [ '${{ matrix.variant }}' = 'archived' ]; then
            python3 -u .github/ci/check_blackbox_p11.py android "$RUNNER_TEMP/blackbox-p11.apk";
            else python3 -u .github/ci/check_blackbox_p11.py android "$RUNNER_TEMP/blackbox-probe.apk" --original "$RUNNER_TEMP/blackbox-p11.apk"
            ${{ matrix.variant == 'native-x86' && '--native-x86' || '' }}; fi
